<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShiftReady Site Trainer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #aecbe3; font-family: Arial, Helvetica, sans-serif; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; touch-action: none; }
  .card { position: fixed; background: rgba(18,24,32,0.88); color: #e6edf5; border-radius: 12px; box-sizing: border-box; font-size: 14px; line-height: 1.35; }
  .card button { border: 0; border-radius: 8px; padding: 8px 12px; font-weight: bold; color: #fff; background: #3a4656; cursor: pointer; font-size: 14px; }
  .card button:hover { filter: brightness(1.15); }
  .card button.primary { background: #1f9d55; font-size: 17px; padding: 11px 18px; }
  .card button.blue { background: #2f6fd6; }
  .card button.danger { background: #7a3434; }
  .card button.on { background: #2f6fd6; outline: 3px solid #ffd200; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .muted { color: #93a3b5; font-size: 12px; }
  .yellow { color: #ffd200; }
  h1 { margin: 0 0 2px; font-size: 26px; color: #ffd200; }
  h2 { margin: 0 0 6px; font-size: 19px; color: #ffd200; }

  #coachBox { bottom: 118px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 24px)); background: rgba(255,255,255,0.95); color: #1b2430; padding: 10px 14px; }
  #coachBox .name { font-weight: bold; color: #1f4e79; font-size: 13px; }
  #coachBox .text { font-size: 15px; margin: 3px 0 6px; }
  #coachBox .chips button { background: #e3eaf3; color: #1f4e79; font-size: 12px; padding: 6px 9px; }

  #docBox { top: 12px; left: 12px; width: 300px; max-height: calc(100% - 150px); overflow: auto; position: fixed; background: rgba(247,245,239,0.96); color: #1b2430; padding: 0 0 10px; }
  #docBox .head { background: #1f4e79; color: #fff; padding: 9px 12px; border-radius: 12px 12px 0 0; }
  #docBox .head b { font-size: 15px; }
  #docBox .note { color: #b42318; font-size: 11px; padding: 6px 12px 2px; }
  #docBox .rule { padding: 5px 12px; margin: 2px 6px; border-radius: 8px; font-size: 12px; line-height: 1.3; }
  #docBox .rule b { font-size: 13px; display: block; }
  #docBox .rule.live { background: #ffeaa0; }
  #docBox .rule.convert { background: #ffd200; }
  #docBox .banner { margin: 6px 6px 0; background: #1b2430; color: #ffd200; border-radius: 8px; padding: 8px; text-align: center; font-weight: bold; }

  #hudBox { top: 12px; right: 12px; width: 330px; padding: 12px 14px; max-height: calc(100% - 24px); overflow: auto; }
  ol.steps { margin: 4px 0 10px; padding-left: 20px; font-size: 13px; }
  ol.steps li { margin: 2px 0; }
  .usual { border-left: 5px solid #ff6a4d; padding-left: 10px; }
  .usual .tag { color: #ff6a4d; font-weight: bold; font-size: 12px; letter-spacing: 1px; }
  .usual .big { font-size: 24px; font-weight: bold; margin: 2px 0 8px; }
  .usual .stat { display: flex; justify-content: space-between; font-size: 14px; margin: 3px 0; }
  .usual .note2 { color: #ffd200; font-weight: bold; margin: 10px 0; }
  .count { font-size: 72px; color: #ffd200; font-weight: bold; text-align: center; line-height: 1.1; }
  .clear { border-radius: 8px; padding: 8px 10px; font-weight: bold; font-size: 17px; margin: 4px 0 4px; }
  .clear.ok { background: #1f7a3d; color: #fff; }
  .clear.no { background: #8a3a24; color: #fff; }
  table.cmp { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 10px; }
  table.cmp th { text-align: left; color: #93a3b5; font-weight: normal; padding: 2px 4px; }
  table.cmp td { padding: 3px 4px; border-top: 1px solid rgba(255,255,255,0.1); }
  table.cmp td:nth-child(2) { color: #ff8a6d; }
  table.cmp td:nth-child(3) { color: #3ccf7a; font-weight: bold; }
  #hudBox .score { font-size: 40px; font-weight: bold; color: #ffd200; line-height: 1; }
  #hudBox .msg { background: rgba(255,255,255,0.08); border-radius: 8px; padding: 9px; font-weight: bold; font-size: 16px; margin: 8px 0; }
  .timer { height: 16px; background: #2c3744; border-radius: 8px; overflow: hidden; position: relative; margin-top: 8px; }
  .timer > div { height: 100%; background: #3ccf7a; }
  .timer span { position: absolute; inset: 0; text-align: center; font-size: 11px; font-weight: bold; color: #111; line-height: 16px; }
  .skill { display: grid; grid-template-columns: 130px 1fr 36px; gap: 6px; align-items: center; font-size: 12px; margin: 3px 0; }
  .skill .track { height: 10px; background: #2c3744; border-radius: 5px; overflow: hidden; }
  .skill .track div { height: 100%; }

  #bar { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
         background: rgba(18,24,32,0.85); color: #e6edf5; padding: 8px 12px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); box-sizing: border-box; }
  #bar form { display: flex; gap: 6px; }
  #bar input { width: 260px; max-width: 45vw; padding: 7px 9px; border-radius: 8px; border: 0; font-size: 14px; }
  #bar button { padding: 7px 12px; border-radius: 8px; border: 0; background: #2f6fd6; color: #fff; font-weight: bold; cursor: pointer; }
  #bar .hint { color: #93a3b5; white-space: nowrap; }
  #docToggle { position: fixed; left: 12px; bottom: 70px; display: none; }
  @media (max-width: 900px) {
    #docBox { display: none; }
    #docBox.open { display: block; z-index: 5; }
    #docToggle { display: block; bottom: 122px; }
    #coachBox { top: auto; bottom: 170px; }
    #hudBox { width: min(330px, calc(100% - 24px)); }
  }
  @media (max-width: 640px) { #bar .hint { display: none; } }
  #coachBox { z-index: 2; }
  #hudBox { z-index: 3; }
  /* laptops with display scaling and small windows: coach bottom-left, score panel right */
  @media (min-width: 641px) and (max-width: 1099px) {
    #coachBox { left: 12px; transform: none; width: min(470px, calc(100% - 378px)); bottom: 118px; top: auto; }
    #docBox { max-height: calc(100% - 330px); }
    #docToggle { left: auto; right: 12px; bottom: 122px; }
  }
  @media (max-width: 1099px) {
    body[data-phase="live"] #coachBox .chips, body[data-phase="resolve"] #coachBox .chips, body[data-phase="gap"] #coachBox .chips, body[data-phase="convert"] #coachBox .chips { display: none; }
  }
  /* phones: keep the page large while it is on screen */
  @media (max-width: 640px) {
    body[data-phase="docs"] #coachBox .chips, body[data-phase="convertAll"] #coachBox .chips, body[data-phase="countdown"] #coachBox .chips, body.review #coachBox .chips { display: none; }
    body[data-phase="docs"] .usual .stat { display: none; }
  }
  body.xr .card, body.xr #bar, body.xr #docToggle { display: none !important; }
  body[data-phase="intro"] #docBox, body[data-phase="docs"] #docBox, body[data-phase="convertAll"] #docBox, body[data-phase="countdown"] #docBox, body.review #docBox,
  body[data-phase="intro"] #docToggle, body[data-phase="docs"] #docToggle, body[data-phase="convertAll"] #docToggle, body[data-phase="countdown"] #docToggle, body.review #docToggle { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>
<div id="docBox" class="card"></div>
<div id="hudBox" class="card"></div>
<div id="coachBox" class="card"></div>
<button id="docToggle" class="card" style="padding:8px 12px;color:#fff;border:0;font-weight:bold;cursor:pointer">Procedure</button>
<div id="bar">
  <span class="hint">Drag to look · click hazards on site</span>
  <form id="askForm"><input id="askInput" placeholder="Ask Riley about a rule…" maxlength="300"><button type="submit">Ask</button></form>
</div>
<script>
  // Optional: set proxyUrl to a server that answers Riley's questions with an AI model.
  window.SHIFTREADY_CONFIG = { proxyUrl: '' };
</script>

ll be clean-shaven at the seal area."},{cat:"edge",h:"4.1 Open edges",t:"Every open edge more than 3 m above the level below shall be protected by a guardrail. Where a guardrail section is removed for material handling, the area shall be closed off or every worker within 2 m of the edge shall be tied off to an approved anchor."},{cat:"trench",h:"5.4 Trenches",t:"No worker shall enter a trench deeper than 1.5 m unless the walls are shored or sloped or a trench box is in place. Spoil shall be kept at least 1 m back from the edge (Section 5.6)."},{cat:"reverse",h:"6.2 Reversing vehicles",t:"Trucks shall reverse only under the direction of a designated spotter. No person shall walk or stand in the path of a reversing vehicle, regardless of backup alarm status."},{cat:"swing",h:"6.5 Excavator swing",t:"No person shall enter the swing radius of an operating excavator. Make eye contact with the operator and wait for a clear signal before approaching."},{h:"6.8 Site roads",t:"The speed limit on all site roads is 15 km/h. Light vehicles yield to heavy equipment at all times."},{cat:"power",h:"7.3 Overhead power lines",t:"Booms, loads and attachments shall remain outside the limit of approach (7 m for lines up to 250 kV). A dedicated spotter shall watch any work within 15 m of the line."},{cat:"env",h:"8.1 Protected ground",t:"Vehicles shall use the haul road and marked routes only. No vehicle shall enter the fenced environmentally sensitive area: its topsoil and wildlife corridor must be restored to pre-construction condition at project close (Environmental Protection Plan EPP-02)."},{h:"8.3 Wildlife",t:"Do not feed or approach wildlife. Report sightings to the site supervisor. Food waste goes in the sealed bins at the site office only."}]},{no:8,paras:[{h:"9.1 Emergency response",t:"On hearing three long blasts of the air horn, stop work, make equipment safe and walk to the muster point at the site office. Do not return until the site supervisor gives the all clear."},{h:"9.2 First aid",t:"First aid kits are kept in the site office and in every supervisor vehicle. Report every injury, however minor, before the end of the shift."},{h:"9.4 Fire",t:"Hot work requires a permit and a fire watch for 60 minutes after the work ends. Fire extinguishers are located at each stair core and on the tower crane base."},{h:"9.6 Severe weather",t:"Crane operations stop when wind speed exceeds the limit in the lift plan. Lightning within 10 km stops all work at height and all crane work."},{h:"10.1 Housekeeping",t:"Keep walkways, stairs and access routes clear. Store materials at least 2 m back from open edges. Remove waste daily to the marked bins."},{h:"10.3 Site amenities",t:"Washrooms and the lunch room are in the site office. Smoking is permitted only in the marked area by the main gate."},{h:"11.1 Hazard reporting",t:"Report every hazard, near miss and incident to your supervisor the same shift. Every worker has the right to refuse unsafe work."},{h:"11.2 Site access",t:"Sign in and out at the gate every day. Visitors must be escorted at all times. Site access cards are not transferable."}]},{no:9,paras:[{h:"12.1 Traffic management",t:"Delivery vehicles enter through Gate 2 only and follow the traffic control person. Deliveries are scheduled through the site office at least 24 hours ahead."},{h:"12.2 Laydown areas",t:"Materials are stored only in the marked laydown areas. Stacks over 1.8 m require bracing or banding."},{h:"12.4 Ladders and scaffolds",t:"Ladders extend 1 m above the landing and are tied off. Scaffolds are inspected and tagged before every shift; a red tag means do not use."},{h:"13.1 Noise",t:"Hearing protection is required in areas marked with the hearing sign and within 10 m of operating equipment."},{h:"13.2 Dust and silica",t:"Use water or local exhaust when cutting concrete. Dry sweeping of silica dust is not permitted."},{h:"14.1 Fitness for work",t:"Workers must be fit for duty. Report any medication that may affect alertness to your supervisor before starting work."},{h:"14.3 Orientation record",t:"This orientation is valid for this site only. Workers transferring from another site must complete it again before entry."}]}],Jn={new:{label:"New worker",skill:.3,window:12,hint:.55},trade:{label:"Experienced trade worker",skill:.55,window:10,hint:.4},super:{label:"Site supervisor",skill:.7,window:8,hint:.25}},Os=8,Fs={first:"First catch",sharp:"Sharp eyes (under 2.5 s)",hattrick:"Hat trick (3 in a row)",bounce:"Bounce back",clean:"Clean shift"},pl=[{keys:["why","train","way","vr","virtual","purpose","point"],a:"Orientation documents are read before every new site and rarely practised. Here each rule on this site's own page becomes a live situation, and I track what you notice and how fast. Spot every rule and you are cleared for site entry."},{keys:["clear","cleared","clearance","entry","access","pass","passed","orientation"],a:"To be cleared for site entry, spot a breach of every rule on the page at least once in a shift. Any rule you miss comes first in the next shift."},{keys:["fictional","real","actual","official","legal","law","regulation"],a:"SP-CON-012 is a fictional procedure written for this demo. Always follow your own site's procedures and the provincial OHS rules."},{keys:["score","points","streak","scoring","badge","badges"],a:"Each catch earns 100 points plus up to 100 for speed, multiplied by your streak. False alarms and misses reset the streak."},{keys:["how","play","click","controls","select","use"],a:"Watch the site. When you see someone or something breaking a rule, point at it and pull the trigger, or click it with the mouse."},{keys:["hello","hi","hey","who"],a:"I'm Riley, your site coach. Ask me about any rule on the orientation page."}];window.__errors=[];window.addEventListener("error",n=>window.__errors.push(String(n.message)));var vl=Object.assign({proxyUrl:""},window.SHIFTREADY_CONFIG||{}),Js=3,Ed=1.6,yl=Js+Ed,wd=new A(0,yl,0),nt=new yr({antialias:!0});nt.setP
